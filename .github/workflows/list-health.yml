name: List health

# Weekly: every upstream list must still download, parse and be within its
# expected size. Opens an issue when one dies (PLAN 8.1).
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check lists
        id: check
        shell: pwsh
        run: |
          go run ./cmd/ab-win list-health | Tee-Object -FilePath report.txt
          "failed=$($LASTEXITCODE -ne 0)" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Open issue
        if: steps.check.outputs.failed == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = "The weekly list-health check found a broken upstream list:`n`n``````n$(Get-Content report.txt -Raw)``````"
          gh issue create --title "List health check failed ($(Get-Date -Format yyyy-MM-dd))" --body $body
          exit 1
